{% extends 'portfolio_app/base_template.html' %}

{% block title %}Logged Out | Portfolio Hub{% endblock %}

{% block content %}
<div class="py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">Logged Out Successfully</h4>
        </div>
        <div class="card-body text-center">
          <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle text-success" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
              <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
            </svg>
          </div>
          <p class="lead">You have been successfully logged out.</p>
          <p class="text-muted">Thank you for using Portfolio Hub!</p>

          <div class="d-grid gap-2 mt-4">
            <a href="{% url 'login' %}" class="btn btn-primary">Login Again</a>
            <a href="{% url 'index' %}" class="btn btn-outline-secondary">Return to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
