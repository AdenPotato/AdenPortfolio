{% extends "portfolio_app/base_template.html" %}

{% block title %}Update Portfolio | Portfolio Hub{% endblock %}

{% block content %}
<div class="py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header">
          <h2 class="mb-0">Update Portfolio</h2>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
              <label for="id_title" class="form-label">Portfolio Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="id_title" name="title" 
                     value="{{ portfolio.title }}" required aria-required="true">
            </div>
            
            <div class="mb-3">
              <label for="id_about" class="form-label">About</label>
              <textarea class="form-control" id="id_about" name="about" 
                        rows="5">{{ portfolio.about }}</textarea>
              <div class="form-text">Tell us about yourself and your work</div>
            </div>
            
            <div class="mb-3">
              <label for="id_contact_email" class="form-label">Contact Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="id_contact_email" 
                     name="contact_email" value="{{ portfolio.contact_email }}" required>
            </div>
            
            <div class="mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="id_is_active" 
                       name="is_active" {% if portfolio.is_active %}checked{% endif %}>
                <label class="form-check-label" for="id_is_active">
                  Active Portfolio
                </label>
                <div class="form-text">Check to make portfolio visible on home page</div>
              </div>
            </div>
            
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save Changes</button>
              <a href="{% url 'portfolio-detail' portfolio.id %}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
